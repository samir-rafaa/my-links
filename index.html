<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samir Rafaa | الصفحة الرسمية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin: 10px 0 5px; font-size: 22px; }
        p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin: 10px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .btn-primary {
            background-color: #1877f2;
            color: white;
            box-shadow: 0 4px 14px rgba(24, 119, 242, 0.4);
        }
        .btn-secondary {
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
        }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Samir Rafaa</h1>
        <p>أروي القصص من الصوت والصورة، وأحول اللحظات إلى حكايات مؤثرة بلغات متعددة وبأسلوب فريد.</p>
        
        <a href="https://www.facebook.com/samir.rafaa.rafaa12" class="btn btn-primary" target="_blank">
            🔵 تابعني على فيسبوك
        </a>
        
        <a href="#" class="btn btn-secondary" target="_blank">📖 قصصي ومدونتي</a>
        <a href="#" class="btn btn-secondary" target="_blank">🎵 حسابي على TikTok</a>
    </div>
</body>
</html>
